name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Deterministic GenVM runtime for gltest direct mode (no GitHub API lookups).
  GENVM_VERSION: v0.6.0-rc5
  PYTHONUTF8: "1"

jobs:
  contracts:
    name: genvm-lint + gltest direct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (Consensus v0.6 RC family)
        run: pip install .
      - name: Cache GenVM runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-${{ env.GENVM_VERSION }}
      - name: genvm-lint
        run: |
          for f in contracts/Monocle.py contracts/MonocleFactory.py contracts/MonocleReputation.py; do
            genvm-lint check "$f"
          done
      - name: gltest (direct mode)
        run: gltest tests/direct -v
      - name: gltest (integration, skips without a node)
        run: gltest tests/integration -v
      - name: Python SDK tests
        run: |
          pip install ./sdk/python
          pytest sdk/python/tests -q -p no:gltest

  sdk:
    name: TypeScript SDK + deploy scripts typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:sdk
      - name: Web app build
        run: npm run build:web
